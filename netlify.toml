# Packet — Netlify config
# From the AXRIK starter kit under licence.
#
# TWO SITES from this one repository, which is the JG Foods pattern:
#
#   packetlabel.com        publish directory: website
#   admin.packetlabel.com  publish directory: admin
#
# The publish directory is set per site in the Netlify UI, NOT here —
# one netlify.toml cannot give two sites different publish paths. What
# lives here is everything the two sites share: the functions folder
# and the security headers.
#
# Each folder has its own config.js holding the same two Supabase
# values. They must match. If you change one, change the other.

[build]
  functions = "netlify-functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# The admin is never for search engines. The public site has its own
# meta robots tags where needed.
[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---- Sourcing ----------------------------------------------------------
# Monday morning: look at the competitors first, then work out what is
# worth selling from what came back. Two separate functions rather than
# one, so a shop being down cannot stop the scoring, and so either half
# can be run on its own from the admin.
#
# Scheduled here rather than with the @netlify/functions helper, because
# that would mean a package.json and a build step, and this repository
# deliberately has neither.
#
# Times are UTC.
[functions."scan-competitors"]
  schedule = "0 5 * * 1"

[functions."build-opportunities"]
  schedule = "30 5 * * 1"
